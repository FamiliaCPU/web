    function conflicts(product, profile=state.profile){const out=[];product.allergens.forEach(a=>{if(profile.allergies.includes(a)) out.push("Contiene "+label(DATA.allergies,a).toLowerCase())});if(profile.diet!=="omnivore"&&!product.diets.includes(profile.diet)) out.push("No encaja con "+label(DATA.diets,profile.diet).toLowerCase());if(profile.health.includes("celiac")&&product.allergens.includes("gluten")) out.push("No apto sin gluten");if(profile.health.includes("lactoseIntolerance")&&product.allergens.includes("lactose")) out.push("No apto sin lactosa");return out}
    function aiScore(product){if(conflicts(product).length>0)return 0;const n=product.nutrition;let score=55;if(product.aisle===state.selectedAisle)score+=8;if(state.profile.budget)score+=Math.max(0,10-product.price*3);if(state.profile.needs.includes("weightLoss"))score+=(n.kcal<=150?20:n.kcal<=330?7:-8)+(n.protein>=10?7:0)+(n.fiber>=5?5:0)+(n.sugar<=3?4:-4);if(state.profile.needs.includes("protein"))score+=n.protein*.5;if(state.profile.needs.includes("iron")||state.profile.health.includes("anemia"))score+=n.iron*2;if(state.profile.needs.includes("lowSugar")||state.profile.health.includes("diabetes"))score+=n.sugar<=3?12:-8;if(state.profile.needs.includes("lowSalt")||state.profile.health.includes("hypertension"))score+=n.salt<=.12?8:-6;if(state.profile.health.includes("cholesterol"))score+=n.saturated<=1.3?6:-4;return Math.max(1,Math.min(99,Math.round(score)))}

    function needsScreen(){return `<section class="screen">${header(label(DATA.aisles,state.selectedAisle))}<div class="center"><div style="margin:26px auto 14px" class="leafLogo">✨</div><h1 class="mainTitle" style="margin-top:0">¿Qué necesitas?</h1><p class="subtitle">Incluye perder peso, dieta, alergias y salud.</p></div><div class="textBox"><textarea id="profileText" placeholder="Ej: quiero perder peso, soy vegano, sin lactosa...">${esc(state.profile.text)}</textarea><button class="primary darkBtn" style="margin-top:10px" data-action="voice">🎙️ Simular voz</button></div>${section("Necesidad principal",DATA.needs,"needs")}${section("Preferencia alimentaria",DATA.diets,"diet")}${section("Alergias o intolerancias",DATA.allergies,"allergies",true,"filtro estricto")}${section("Salud",DATA.health,"health")}<div class="warning"><strong>⚠️ Información orientativa</strong><br>En alergias o enfermedades, revisa siempre el etiquetado real.</div><button class="primary" data-action="generate">Generar recomendación IA</button></section>`}
    function productCard(p){const bad=conflicts(p);const safe=bad.length===0;return `<article class="card ${safe?"":"blocked"}"><button style="width:100%;text-align:left;background:transparent;padding:0" data-action="detail" data-id="${p.id}">${productImg(p)}<div class="cardMain"><div><h3>${esc(p.name)}</h3><p class="small muted">${esc(p.size)} · en tu pasillo</p></div><div class="ai">${p.aiScore}%</div></div></button><div class="priceScore"><div class="price">${money(p.price)}</div>${scoreHTML(p.score)}</div><div class="tagWrap">${p.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div><div class="status ${safe?"":"bad"}">${safe?"Apto según tus filtros":esc(bad.join(" · "))}</div><p class="why">${esc(p.why)}</p><div class="actions"><button class="${safe?"primary":"secondary"}" style="margin:0" data-action="add" data-id="${p.id}" ${safe?"":"disabled"}>Añadir</button><button class="secondary" data-action="compare" data-id="${p.id}">Comparar</button><button class="darkBtn" data-action="map" data-id="${p.id}">Ubicar</button></div></article>`}
    function results(){const items=recommended();const safeCount=items.filter(p=>conflicts(p).length===0).length;const lowest=items.length?Math.min(...items.map(p=>p.price)):0;const chips=[...state.profile.needs.map(id=>label(DATA.needs,id)),label(DATA.diets,state.profile.diet),...state.profile.allergies.map(id=>"Sin "+label(DATA.allergies,id))].slice(0,5);return `<section class="screen soft">${header(label(DATA.aisles,state.selectedAisle))}<div class="hero"><div class="heroRow"><div class="heroIcon">✨</div><div><div class="heroTitle">Recomendación IA segura</div><p>Filtrado por nutrición, dieta, alergias y ubicación real del pasillo.</p><div class="pillRow">${chips.map(c=>`<span class="pill">${esc(c)}</span>`).join("")}</div></div></div></div><div class="miniGrid"><div class="mini"><div class="miniVal">${safeCount}</div><div class="miniLab">aptas</div></div><div class="mini"><div class="miniVal" style="color:#047857">A</div><div class="miniLab">mejor score</div></div><div class="mini"><div class="miniVal">${money(lowest)}</div><div class="miniLab">mínimo</div></div></div><div class="titleRow"><div><h2>Recomendados</h2><p>Solo ${esc(label(DATA.aisles,state.selectedAisle))}</p></div><button class="linkBtn" data-action="all">Ver todos</button></div><div class="cards">${items.length?items.map(productCard).join(""):`<div class="empty">No hay productos en esta sección.</div>`}</div><button class="outlineGreen" data-action="nav-list">Ver lista inteligente →</button></section>`}
    function detail(){const p=productById(state.selectedProduct);const bad=conflicts(p);const safe=bad.length===0;const n=p.nutrition;const nutrients=[["Calorías",n.kcal,"kcal"],["Proteínas",n.protein,"g"],["Grasas",n.fat,"g"],["Saturadas",n.saturated,"g"],["Hidratos",n.carbs,"g"],["Azúcar",n.sugar,"g"],["Fibra",n.fiber,"g"],["Hierro",n.iron,"mg"],["Sal",n.salt,"g"],["Calcio",n.calcium,"mg"],["Potasio",n.potassium,"mg"],["Magnesio",n.magnesium,"mg"]];return `<section class="screen">${header("Detalle nutricional",true)}${productImg(p,"big")}<div class="detailTitle"><div><h1>${esc(p.name)}</h1><p class="small muted">${esc(p.location)}</p></div><div class="price">${money(p.price)}</div></div><div class="infoBox ${safe?"ok":"bad"}"><strong>${safe?"✓ Compatible":"⚠ No recomendado"}</strong><p class="small">${safe?"No se detectan conflictos.":esc(bad.join(" · "))}</p></div><div class="infoBox"><strong>Nutri-Score</strong><div style="margin-top:10px">${scoreHTML(p.score)}</div></div><div class="hero"><div class="heroTitle">✨ ¿Por qué?</div><p>${esc(p.why)}</p></div><h2 class="section">Información nutricional</h2><div class="nutriGrid">${nutrients.map(([name,value,unit])=>`<div class="nutri"><div class="nutriName">${name}</div><div class="nutriValue">${value}<span class="small muted"> ${unit}</span></div></div>`).join("")}</div><h2 class="section">Alérgenos e ingredientes</h2><div class="infoBox"><strong>Alérgenos</strong><p class="small muted">${p.allergens.length?p.allergens.map(id=>label(DATA.allergies,id)).join(" · "):"Sin alérgenos principales declarados"}</p><strong>Trazas</strong><p class="small muted">${p.traces.length?p.traces.join(" · "):"Sin trazas indicadas"}</p><strong>Ingredientes</strong><p class="small muted">${esc(p.ingredients)}</p></div><div class="actions"><button class="${safe?"primary":"secondary"}" style="margin:0" data-action="add" data-id="${p.id}" ${safe?"":"disabled"}>Añadir</button><button class="secondary" data-action="compare" data-id="${p.id}">Comparar</button><button class="darkBtn" data-action="map" data-id="${p.id}">Ubicar</button></div></section>`}
    function compare(){const chosen=state.compareItems.map(productById).slice(0,3);const rows=[["Precio","price","min",5],["Proteína","protein","max",25],["Calorías","kcal","min",400],["Azúcar","sugar","min",12],["Sal","salt","min",1],["Hierro","iron","max",8],["Fibra","fiber","max",20]];function val(p,k){return k==="price"?p.price:p.nutrition[k]}function best(p,k,mode){const vals=chosen.map(x=>val(x,k));return mode==="min"?val(p,k)===Math.min(...vals):val(p,k)===Math.max(...vals)}const bestSafe=chosen.find(p=>conflicts(p).length===0)||chosen[0];return `<section class="screen">${header("Comparador",true)}<div class="hero"><div class="heroTitle">Mejor opción IA</div><p>${esc(bestSafe.name)} es la primera opción compatible.</p></div><div class="compareTop">${chosen.map(p=>`<div class="compareItem">${productImg(p,"mini")}<div class="compareName">${esc(p.short)}</div><div class="status ${conflicts(p).length?"bad":""}" style="font-size:9px;padding:5px;margin-top:8px">${conflicts(p).length?"Evitar":"Apto"}</div></div>`).join("")}</div><div class="table">${rows.map(([row,k,mode,max])=>`<div class="row"><div class="rowHead">${row}</div>${chosen.map(p=>{const v=val(p,k);const b=best(p,k,mode);const w=Math.min(100,(v/max)*100);return `<div class="cell ${b?"best":""}">${k==="price"?money(v):v}<div class="bar"><span style="width:${w}%"></span></div></div>`}).join("")}</div>`).join("")}</div><button class="primary" data-action="add" data-id="${bestSafe.id}">Añadir opción apta</button></section>`}
    function mapScreen(){const p=productById(state.selectedProduct);return `<section class="screen">${header("Navegación",true)}<div class="infoBox"><h1 style="margin:0;font-size:25px">${esc(p.name)}</h1><p class="small muted">${esc(p.location)}</p></div><div class="mapArea"><div class="shelves">${Array.from({length:16}).map(()=>`<div class="shelf"></div>`).join("")}</div><div class="route1"></div><div class="route2"></div><div class="pin">📍</div><div class="here">Estás aquí</div></div><div class="hero"><div class="heroTitle" style="font-size:20px">📍 2 pasillos a la derecha</div><p>Avanza recto y gira a la derecha.</p></div></section>`}
    function listScreen(){const items=state.cart.map(c=>({...productById(c.id),qty:c.qty}));const total=items.reduce((s,i)=>s+i.price*i.qty,0);const protein=items.reduce((s,i)=>s+i.nutrition.protein*i.qty,0);const iron=items.reduce((s,i)=>s+i.nutrition.iron*i.qty,0);const fiber=items.reduce((s,i)=>s+i.nutrition.fiber*i.qty,0);return `<section class="screen">${header("Lista inteligente",true)}<div class="cartHero"><div class="small" style="color:rgba(255,255,255,.75);font-weight:850">Total estimado</div><div class="cartTotal">${money(total)}</div><div class="miniGrid"><span class="pill">${protein.toFixed(1)}g prot.</span><span class="pill">${iron.toFixed(1)}mg Fe</span><span class="pill">${fiber.toFixed(1)}g fibra</span></div></div>${items.length?items.map(item=>`<div class="cartItem"><div class="cartImg">${productImg(item,"mini")}</div><div style="min-width:0;flex:1"><div class="cartName">${esc(item.name)}</div><div class="small muted">${money(item.price)}</div></div><div class="qty"><button data-action="qty" data-id="${item.id}" data-amount="-1">−</button><span>${item.qty}</span><button data-action="qty" data-id="${item.id}" data-amount="1">+</button></div><button class="roundBtn dangerBtn" data-action="remove" data-id="${item.id}">🗑</button></div>`).join(""):`<div class="empty">🧺<br><strong>Tu lista está vacía</strong></div>`}</section>`}
    function profile(){const p=state.profile;return `<section class="screen">${header("Perfil",true)}<div class="hero"><div class="heroRow"><div class="heroIcon">👤</div><div><div style="font-size:20px;font-weight:950">Compra inteligente</div><p>Filtros activos</p></div></div></div>${info("Dieta",label(DATA.diets,p.diet))}${info("Necesidades",p.needs.map(id=>label(DATA.needs,id)).join(" · ")||"Sin necesidades")}${info("Alergias",p.allergies.map(id=>label(DATA.allergies,id)).join(" · ")||"Sin alergias marcadas",p.allergies.length>0)}${info("Salud",p.health.map(id=>label(DATA.health,id)).join(" · ")||"Sin objetivos")}<button class="primary darkBtn" data-action="reset">Restablecer filtros</button></section>`}
    function info(title,text,red=false){return `<div class="infoBox"><strong>${esc(title)}</strong><p class="small" style="color:${red?"#b91c1c":"#52525b"}">${esc(text)}</p></div>`}
    function bottomNav(){const count=state.cart.reduce((s,i)=>s+i.qty,0);const items=[["home","Inicio","⌂"],["results","Explorar","🔎"],["list","Lista","🧺"],["profile","Perfil","👤"]];return `<nav class="bottomNav"><div class="navGrid">${items.map(([id,label,ico])=>`<button class="navBtn ${state.active===id?"active":""}" data-action="nav" data-id="${id}"><span class="ico">${ico}</span><span>${label}</span>${id==="list"&&count>0?`<span class="count">${count}</span>`:""}</button>`).join("")}</div></nav>`}
    function chat(){return `<div class="chat ${state.chatOpen?"open":""}">${header("Asistente IA",false,true)}<div class="chatBody"><div class="messages">${state.messages.map(m=>`<div class="msg ${m.from}">${esc(m.text)}</div>`).join("")}<div class="quick">${["Perder peso","Más hierro","Menos azúcar","Vegano","Sin lactosa","Sin gluten","Comparar"].map(c=>`<button data-action="quick" data-text="${esc(c)}">${esc(c)}</button>`).join("")}</div></div><div class="chatInput"><input id="chatInput" placeholder="Escribe..."><button data-action="ask">🎙️</button></div></div></div>`}
    function render(){let html="";if(state.screen==="home")html=home();if(state.screen==="needs")html=needsScreen();if(state.screen==="results")html=results();if(state.screen==="detail")html=detail();if(state.screen==="compare")html=compare();if(state.screen==="map")html=mapScreen();if(state.screen==="list")html=listScreen();if(state.screen==="profile")html=profile();html+=bottomNav()+`<button class="chatFab" data-action="chat-open">🤖</button>`+chat()+(state.toast?`<div class="toast">${esc(state.toast)}</div>`:"");app.innerHTML=html}
    function ask(text){const input=document.getElementById("chatInput");const q=(text || (input?input.value:"")).trim();if(!q)return;const lower=q.toLowerCase();let answer="La opción más equilibrada suele ser la que combine buen aporte nutricional, precio bajo y compatibilidad con tus filtros.";if(lower.includes("peso")||lower.includes("adelgazar")||lower.includes("perder"))answer="Para perder peso priorizaría opciones bajas en calorías y con proteína o fibra. En bebidas, agua o soja sin azúcar; en carnes, pollo o pavo; en verduras, espinacas o tofu.";if(lower.includes("hierro"))answer="Para hierro destacan lentejas, garbanzos, avena y espinacas. Si hay anemia, combínalo con vitamina C y revisa indicación médica.";if(lower.includes("azúcar"))answer="Para menos azúcar: agua, soja sin azúcar, espinacas, tofu, avena y lentejas. Evitaría el zumo si el objetivo es controlar azúcar.";if(lower.includes("vegano"))answer="Opciones veganas: lentejas, garbanzos, espinacas, avena, tofu, agua y bebida de soja sin azúcar.";if(lower.includes("lactosa"))answer="Sin lactosa: evita el yogur proteico. En bebidas puede encajar la soja sin azúcar si no marcas alergia a la soja.";if(lower.includes("gluten"))answer="Sin gluten: evita la avena de esta simulación. Revisa trazas en legumbres si necesitas control estricto.";state.messages.push({from:"user",text:q},{from:"ai",text:answer});render()}
    app.addEventListener("input",e=>{if(e.target.id==="profileText")state.profile.text=e.target.value});
    app.addEventListener("keydown",e=>{if(e.target.id==="chatInput"&&e.key==="Enter")ask()});
    app.addEventListener("click",e=>{const btn=e.target.closest("[data-action]");if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;if(a==="select-aisle"){state.selectedAisle=id;render()}if(a==="go-needs")setScreen("needs");if(a==="toggle"){const type=btn.dataset.type;if(type==="diet")state.profile.diet=id;else{const arr=state.profile[type];state.profile[type]=arr.includes(id)?arr.filter(x=>x!==id):arr.concat(id)}render()}if(a==="voice"){state.profile.text="Quiero perder peso, tomar proteína y evitar lactosa";state.profile.needs=Array.from(new Set(state.profile.needs.concat(["weightLoss","protein"])));state.profile.allergies=Array.from(new Set(state.profile.allergies.concat(["lactose"])));render()}if(a==="generate")setScreen("results","results");if(a==="detail"){state.selectedProduct=id;setScreen("detail")}if(a==="add"){const p=productById(id);if(conflicts(p).length){notify("Producto bloqueado por tus filtros");return}const found=state.cart.find(x=>x.id===id);if(found)found.qty+=1;else state.cart.push({id,qty:1});notify("Añadido a la lista")}if(a==="compare"){state.compareItems=[id].concat(DATA.products.filter(p=>p.id!==id && p.aisle===productById(id).aisle).map(p=>p.id)).concat(DATA.products.filter(p=>p.id!==id).map(p=>p.id)).slice(0,3);setScreen("compare")}if(a==="map"){state.selectedProduct=id;setScreen("map")}if(a==="all")notify("Ya estás viendo solo los productos de este pasillo");if(a==="nav-list")setScreen("list","list");if(a==="back")setScreen("results","results");if(a==="nav"){state.active=id;setScreen(id,id)}if(a==="qty"){const item=state.cart.find(x=>x.id===id);if(item)item.qty=Math.max(1,item.qty+Number(btn.dataset.amount));render()}if(a==="remove"){state.cart=state.cart.filter(x=>x.id!==id);render()}if(a==="reset"){state.profile=structuredClone(DATA.defaultProfile);render()}if(a==="chat-open"){state.chatOpen=true;render()}if(a==="chat-close"){state.chatOpen=false;render()}if(a==="quick"){const text=btn.dataset.text;if(text==="Comparar"){state.chatOpen=false;state.compareItems=recommended().slice(0,3).map(p=>p.id);setScreen("compare")}else ask(text)}if(a==="ask")ask()});
    render();
  </script>
</body>
</html>
